<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Layout</title>

<style>



body{
    background-color: rgb(254, 242, 16);
}



ul{
    list-style: none;
    display: flex;
    justify-content: flex-end;
    padding: 15px;
    background-color: black
}




li{
    margin-left: 20px;
}



a{
    text-decoration: none;
    color: white;
    padding: 10px 15px;
    border-radius: 5px;
    display: inline-block;
    transition: all 0.3s ease;
}

a:hover{
    background-color: white;
    color: black;
    border-radius: 15px;
   
}

</style>
</head>
<body>

    <div class="header">
        <ul>
            <li><a href="https://www.google.com">HOME</a></li>
            <li><a href="https://about.google">ABOUT</a></li>
            <li><a href="https://store.google.com">PRODUCTS</a></li>
            <li><a href="https://myaccount.google.com">SIGN IN</a></li>
        </ul>
    </div>

</body>
</html>
